apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-shop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
