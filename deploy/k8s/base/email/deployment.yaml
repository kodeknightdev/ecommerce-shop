apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: ecommerce-shop
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: email
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email
        app.kubernetes.io/part-of: ecommerce-shop
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: email
        image: "ecommerceshop/email:0.0.0"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: SMTP_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: REDIS_HOST
        - name: REDIS_URL
          value: redis://$(REDIS_HOST):6379/2
        - name: SHOP_URL
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: SHOP_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: ecommerce-shop-secrets
              key: jwt-signing-key
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
