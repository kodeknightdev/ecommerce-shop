apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: ecommerce-shop
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: ecommerce-shop
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: gateway
        image: "ecommerceshop/gateway:0.0.0"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: ecommerce-shop-secrets
              key: jwt-signing-key
        - name: ReverseProxy__Clusters__identity__Destinations__primary__Address
          value: "http://identity:8080"
        - name: ReverseProxy__Clusters__catalog__Destinations__primary__Address
          value: "http://catalog:8080"
        - name: ReverseProxy__Clusters__orders__Destinations__primary__Address
          value: "http://orders:8080"
        - name: ReverseProxy__Clusters__payments__Destinations__primary__Address
          value: "http://payments:8080"
        - name: ReverseProxy__Clusters__inventory__Destinations__primary__Address
          value: "http://inventory:8000"
        - name: ReverseProxy__Clusters__cart__Destinations__primary__Address
          value: "http://cart:3000"
        - name: ReverseProxy__Clusters__email__Destinations__primary__Address
          value: "http://email:3000"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
