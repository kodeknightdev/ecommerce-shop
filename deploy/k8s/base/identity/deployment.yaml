apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: ecommerce-shop
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: ecommerce-shop
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: identity
        image: "ecommerceshop/identity:0.0.0"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: Database__MigrateOnStartup
          value: "true"
        - name: Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: ecommerce-shop-secrets
              key: jwt-signing-key
        - name: Kafka__BootstrapServers
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: ecommerce-shop-config
              key: POSTGRES_HOST
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ecommerce-shop-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-shop-secrets
              key: postgres-password
        - name: ConnectionStrings__IdentityDb
          value: Host=$(POSTGRES_HOST);Database=identity_db;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
        - name: SEED_DEMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-shop-secrets
              key: seed-demo-password
              optional: true
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
